<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPLADS Sentinel — MoSPI Anomaly Screening & Governance Portal</title>
  <meta name="description" content="Institutional decision support and risk explainability portal for MPLADS developmental works. Automated audit verification discrepancies detected against DPR guidelines.">

  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <!-- Compiled Stitch CSS Rules -->
  <link rel="stylesheet" href="css/stitch-compiled.css">

  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
    }
    /* Hide scrollbars cleanly across browsers */
    *::-webkit-scrollbar {
      display: none;
    }
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
  </style>
</head>
<body class="bg-background font-body-md text-body-md text-on-surface min-h-screen antialiased">

  <!-- Top Sticky Institutional Header -->
  <header class="fixed top-0 left-0 right-0 h-16 bg-surface-container-lowest border-b border-outline-variant z-50 flex items-center justify-between px-margin-screen">
    <div class="flex items-center gap-space-md min-w-[320px]">
      <a href="#/" class="flex items-center gap-space-md hover:opacity-90 transition-opacity">
        <img alt="Institutional emblem badge for MPLADS Sentinel" class="h-8 w-auto object-contain rounded-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1W8wNBvR_QSxbRcC9ZYWRhKmHzxVI7kkeXmbpBMjXovBK-5kOs7ltc-SFKYmUAXGFj3UoX35VGk-VwCIEIbz3fiAxrKagssXhV26V8NCD4jJYpLTDqN6XdKTfwtmXNKL833HLOSXLdtpHilGsec3RZ6_wbLGAiUIDo12VxhKfKfTTQOwjOU9DLEn6a5PZmXR8XY-3yxaMTm4jYkXDF7u5n9W7U3iMy-VDEM4ELrAwy-Pn-ZxotSGhleIGs">
        <div class="flex flex-col">
          <span class="font-title-sm text-title-sm text-primary tracking-tight font-bold">MPLADS Sentinel</span>
          <span class="font-label-sm text-label-sm text-secondary uppercase">Ministry of Statistics &amp; Programme Implementation | Govt. of India</span>
        </div>
      </a>
    </div>

    <!-- Global Omnibar Search Input -->
    <div class="flex-1 max-w-xl px-space-lg">
      <div class="relative flex items-center">
        <span class="material-symbols-outlined absolute left-space-sm text-outline pointer-events-none text-[18px]">search</span>
        <input id="globalSearchInput" class="w-full pl-9 pr-space-md py-space-xs font-body-sm text-body-sm bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container transition-colors" placeholder="Search by Project ID, Constituency, or State (Press Enter)..." type="search">
      </div>
    </div>

    <!-- Right Header Actions & Officer Profile -->
    <div class="flex items-center gap-space-lg">
      <a href="#/investigations" aria-label="Statutory Alerts" class="relative p-space-xs text-secondary hover:text-on-surface hover:bg-surface-container transition-colors rounded-lg" title="Investigation Queue">
        <span class="material-symbols-outlined text-[20px]">notifications</span>
        <span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full animate-pulse"></span>
      </a>
      <div class="h-8 w-px bg-outline-variant"></div>
      <div class="flex items-center gap-space-md">
        <img alt="Nodal Audit Officer Profile" class="w-8 h-8 rounded-full object-cover border border-outline-variant" src="https://lh3.googleusercontent.com/aida/AEtjO1WibgJ1bNrFTqvsljhekN4HrLvrITliLWXaQAMGutmzGLFVbD4zvQgjq4yL--TDf_i7EotysFyXcD2GAeHwfyFrPW4W2z8wYfkaKXNailqhzgtmCIJCQCdj0JPbwhcbqsXEUHVDXI-mLNlCh7_-62s4bUP7FGyYvgxrgM2Q8jvLrLYTOxUmY2XFQbuqUBKt_bJ5-8L1NAK6ecayzKXmih3PzvMPCSOZxsUE6SHs3ZOP6sohF17wrJycVSU">
        <div class="flex flex-col text-left">
          <span class="font-title-sm text-title-sm text-on-surface leading-tight font-semibold">Rajesh K. Sharma, IAS</span>
          <span class="font-label-sm text-label-sm text-secondary leading-tight">Nodal Audit Officer</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Left Administrative Sidebar -->
  <aside class="fixed left-0 top-16 bottom-0 w-64 bg-surface-container-lowest border-r border-outline-variant z-40 flex flex-col justify-between">
    <div class="py-space-md">
      <div class="px-space-base pb-space-sm border-b border-outline-variant mb-space-sm">
        <span class="font-label-sm text-label-sm text-outline uppercase tracking-wider font-semibold">Administrative Navigation</span>
      </div>
      <nav class="flex flex-col gap-space-2xs px-space-sm" id="sidebarNav">
        <a class="flex items-center gap-space-md px-space-base py-space-sm rounded-lg transition-colors bg-primary-container text-on-primary font-title-sm" data-nav-item="dashboard" href="#/">
          <span class="material-symbols-outlined text-[20px]">dashboard</span>
          <span>Dashboard</span>
        </a>
        <a class="flex items-center gap-space-md px-space-base py-space-sm rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors font-body-md text-body-md" data-nav-item="projects" href="#/projects">
          <span class="material-symbols-outlined text-[20px]">inventory_2</span>
          <span>Projects</span>
        </a>
        <a class="flex items-center gap-space-md px-space-base py-space-sm rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors font-body-md text-body-md" data-nav-item="investigations" href="#/investigations">
          <span class="material-symbols-outlined text-[20px]">rule</span>
          <span>Investigation Queue</span>
        </a>
        <a class="flex items-center gap-space-md px-space-base py-space-sm rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors font-body-md text-body-md" data-nav-item="analytics" href="#/analytics">
          <span class="material-symbols-outlined text-[20px]">monitoring</span>
          <span>Analytics</span>
        </a>
      </nav>
    </div>

    <!-- Bottom System Status Pill -->
    <div class="p-space-base border-t border-outline-variant bg-surface-container-low">
      <div class="font-label-sm text-label-sm text-secondary flex items-center gap-space-xs">
        <span id="systemHealthDot" class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
        <span id="systemHealthText">PostgreSQL Connected • Live</span>
      </div>
    </div>
  </aside>

  <!-- Dynamic Screen Mount Container -->
  <div id="app-content"></div>

  <!-- Application Architecture Scripts -->
  <script src="js/config.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/components/chart_utils.js"></script>
  <script src="js/components/india_map.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/project_detail.js"></script>
  <script src="js/views/investigations.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
